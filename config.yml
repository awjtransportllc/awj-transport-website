backend:
  name: git-gateway
  branch: main

media_folder: "content/uploads"
public_folder: "/content/uploads"

collections:
  - name: "site"
    label: "Website Content"
    files:
      - name: "main"
        label: "Homepage Content"
        file: "content/site.json"
        fields:
          - { label: "Logo Image (upload to replace default logo)", name: "logo_image", widget: "image", required: false }

          - { label: "— HERO SECTION —", name: "hero_divider", widget: "hidden", default: "" }
          - { label: "Hero Small Label", name: "hero_eyebrow", widget: "string" }
          - { label: "Hero Headline (line 1)", name: "hero_title_line1", widget: "string" }
          - { label: "Hero Headline (highlighted line)", name: "hero_title_line2", widget: "string" }
          - { label: "Hero Headline (ending)", name: "hero_title_end", widget: "string" }
          - { label: "Hero Paragraph", name: "hero_lede", widget: "text" }
          - { label: "Stat 1 Number", name: "stat1_num", widget: "string" }
          - { label: "Stat 1 Label", name: "stat1_label", widget: "string" }
          - { label: "Stat 2 Number", name: "stat2_num", widget: "string" }
          - { label: "Stat 2 Label", name: "stat2_label", widget: "string" }
          - { label: "Stat 3 Number", name: "stat3_num", widget: "string" }
          - { label: "Stat 3 Label", name: "stat3_label", widget: "string" }

          - { label: "— SERVICES (6 cards) —", name: "svc_divider", widget: "hidden", default: "" }
          - label: "Services"
            name: "services"
            widget: "list"
            fields:
              - { label: "Service Title", name: "title", widget: "string" }
              - { label: "Service Description", name: "description", widget: "text" }

          - { label: "— ABOUT SECTION —", name: "about_divider", widget: "hidden", default: "" }
          - { label: "About Title", name: "about_title", widget: "string" }
          - { label: "About Paragraph 1", name: "about_p1", widget: "text" }
          - { label: "About Paragraph 2", name: "about_p2", widget: "text" }

          - { label: "— CONTACT INFO —", name: "contact_divider", widget: "hidden", default: "" }
          - { label: "CEO Name", name: "ceo_name", widget: "string" }
          - { label: "CEO Title", name: "ceo_title", widget: "string" }
          - { label: "CEO Phone (with country code, e.g. +971551042144)", name: "ceo_phone", widget: "string" }
          - { label: "CEO Phone Display (e.g. +971 55 104 2144)", name: "ceo_phone_display", widget: "string" }
          - { label: "Office Phone (with country code)", name: "office_phone", widget: "string" }
          - { label: "Office Phone Display", name: "office_phone_display", widget: "string" }
          - { label: "Primary Email", name: "email_primary", widget: "string" }
          - { label: "Secondary Email", name: "email_secondary", widget: "string" }
          - { label: "Office Address (HTML — use <br> for line breaks)", name: "office_address", widget: "text" }
